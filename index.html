<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdowns</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Cinzel:wght@400..900&family=Expletus+Sans:ital,wght@0,400..700;1,400..700&family=Fira+Code:wght@300..700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="styles.css">
    </body>
</head>

<body>
    <section id="hidden">
        <nav id="nav">
            <div id="nav-wrapper">
                <h1>Countdown App</h1>
                <div id="nav-right">
                    <button id="add-countdown-btn" class="nav-btn" onclick="openModal()">
                        New Countdown <span class="material-icons">add</span>
                    </button>
                    <button id="delete-all-completed-btn" class="nav-btn" onclick="deleteAllCompletedCountdowns()">
                        Delete All Completed <span class="material-icons" >delete</span>
                    </button>
                    <button id="delete-all-btn" class="nav-btn" onclick="deleteAllCountdowns()">
                        Delete All <span class="material-icons" >delete_forever</span>
                    </button>
                </div>
            </div>

        </nav>
        <div id="app-wrapper">
            <div id="header">
                <h1>Active Countdowns</h1>
            </div>
            <div id="countdown-wrapper">
                <div class="countdown-item-new" id="countdown-add" onclick="openModal()">
                    <span class="material-icons">add</span>
                </div>
            </div>
            <div id="footer">
                <p>Made by Jan Zapletal</p>
            </div>
        </div>
    </section>

    <div id="modal" class="hidden">
        <div id="modal-content" class="hidden">
            <h2 id="modal-title">New Countdown</h2>
            <form id="add-countdown-form">
                <label for="countdown-title">Title:</label>
                <input type="text" id="countdown-title-input" name="countdown-title" required>
                <label for="countdown-date">Target Date:</label>
                <input type="datetime-local" id="countdown-date-input" name="countdown-date" required>
                <button type="submit" id="create-modal-btn">Create Countdown</button>
                <button id="close-modal-btn" onclick="closeModal()">Cancel</button>

            </form>
        </div>
    </div>
    </section>

    <script src="code.js"></script>

</body>
